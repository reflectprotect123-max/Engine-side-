# Netlify deployment config for engineside ("The Engine").
# The app is a fully static site; `build:site` assembles the runtime files
# (plus the esbuild-bundled adaptive package) into `dist/`, which is published.

[build]
  command = "pnpm run build:site"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The service worker must not be cached by the CDN/browser so clients pick up
# new deploys promptly.
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

# Static single-page app: unknown paths fall back to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
